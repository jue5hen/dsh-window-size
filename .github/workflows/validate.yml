name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs'); for (const f of ['package.json','locale/zh.json','locale/en.json']) { JSON.parse(fs.readFileSync(f,'utf8')); } console.log('json ok')"

      - name: Validate bundle manifest
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.name !== 'dsh-window-size') throw new Error('unexpected package name');
          if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) throw new Error('missing dsh.bundle.patch');
          if (!p.dsh.client || p.dsh.client.platform !== 'web') throw new Error('missing dsh.client.platform');
          if (!Array.isArray(p.dsh.client.inject)) throw new Error('dsh.client.inject must be an array');
          const patch = fs.readFileSync('cordis.patch.yml', 'utf8');
          if (!patch.includes('dsh-window-size')) throw new Error('cordis.patch.yml does not register the plugin');
          if (!fs.existsSync(p.dsh.bundle.patch)) throw new Error('patch file is missing');
          console.log('manifest ok');
          "
